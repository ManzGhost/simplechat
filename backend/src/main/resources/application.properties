# Server Configuration
server.port=${PORT:8080}

# MongoDB Database Configuration (MongoDB Atlas via MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:simplechat}
spring.data.mongodb.auto-index-creation=false

# JWT Configuration (at least 256-bit key for HS256)
app.jwt.secret=${JWT_SECRET:simplechat_jwt_secret_key_production_safe_256bit_min_length_required_here!}
app.jwt.expiration-ms=604800000

# Logging
logging.level.com.simplechat=INFO
logging.level.org.springframework.web.socket=INFO
